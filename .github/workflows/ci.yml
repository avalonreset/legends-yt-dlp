name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_release.py --root .
      - run: python -m pip install --upgrade "pip>=26.2.2" setuptools build
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: legends-youtube doctor --json
      - run: legends-youtube yt-dlp --help
      - run: legends-yt-dlp --help
      - run: legends-yt-dlp doctor --offline
      - run: python scripts/smoke_installed_resources.py
