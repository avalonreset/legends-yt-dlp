[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legends-yt-dlp"
version = "0.3.0"
description = "Windows-first yt-dlp orchestration CLI for source capture, verification, and creator clip workflows with optional Mullvad VPN controls."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Legends" }
]
license = { text = "MIT" }
dependencies = []

[project.scripts]
legends-yt-dlp = "legends_ytdlp.cli:main"
slayer = "legends_ytdlp.cli:main"
printing-press = "legends_ytdlp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
